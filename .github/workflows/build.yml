name: Build

on:
  push:
    branches: ['16.0']
    tags: ['*']
  pull_request:
    branches: ['16.0']

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python unit tests
        run: |
          cd ametras_fast_import_addon
          for f in tests/test_batch_size_adapter.py \
                   tests/test_idempotency.py \
                   tests/test_importer_timeout_pipeline.py \
                   tests/test_importer_comprehensive.py \
                   tests/test_parser_edge_cases.py \
                   tests/test_resolver_integration.py \
                   tests/test_transformer.py \
                   tests/test_import_job_control.py \
                   tests/test_import_job_flow.py; do
            echo "--- $f ---"
            python3 "$f" -v
          done

  test-vue-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ametras_fast_import_addon/vue-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ametras_fast_import_addon/vue-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ametras_fast_import_addon/vue-app/package-lock.json
            ametras_fast_import_client/package-lock.json
      - run: cd ametras_fast_import_addon/vue-app && npm ci
      - run: cd ametras_fast_import_client && npm ci
      - run: cd ametras_fast_import_client && npm run lint
      - run: cd ametras_fast_import_client && npm run typecheck

  build-addon:
    needs: [test-python, test-vue-app]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ametras_fast_import_addon/vue-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ametras_fast_import_addon/vue-app/package-lock.json
      - run: npm ci
      - run: npm run build

  build-client:
    needs: [test-python, test-vue-app, test-client]
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: mac-arm64
            build_arch: arm64
            build_target: mac
            runtime_arch: arm64
            runtime_platform: darwin
          - os: windows-latest
            artifact: win-x64
            build_arch: x64
            build_target: win
            runtime_arch: x64
            runtime_platform: win32
          - os: ubuntu-latest
            artifact: linux-x64
            build_arch: x64
            build_target: linux
            runtime_arch: x64
            runtime_platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ametras_fast_import_addon/vue-app/package-lock.json
            ametras_fast_import_client/package-lock.json
      - run: cd ametras_fast_import_addon/vue-app && npm ci
      - run: cd ametras_fast_import_client && npm ci
      - run: cd ametras_fast_import_client && bash scripts/download-python.sh ${{ matrix.runtime_platform }} ${{ matrix.runtime_arch }}
      - run: cd ametras_fast_import_client && npm run build
      - run: cd ametras_fast_import_client && npx electron-builder --${{ matrix.build_target }} --${{ matrix.build_arch }} --publish never
        env:
          # Skip keychain certificate lookup — ad-hoc signing is sufficient.
          # The download-python.sh script re-signs python-runtime binaries so
          # electron-builder can produce a consistently signed bundle.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ametras-fast-import-${{ matrix.artifact }}
          path: |
            ametras_fast_import_client/release/*.dmg
            ametras_fast_import_client/release/*.exe
            ametras_fast_import_client/release/*.AppImage
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-addon, build-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ametras-fast-import-*
          path: release-assets
          merge-multiple: true
      - name: Verify release artifacts
        run: |
          ls -lah release-assets
          ls -lah release-assets/*.dmg
          ls -lah release-assets/*.exe
          ls -lah release-assets/*.AppImage
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.AppImage
