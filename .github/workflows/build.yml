name: Build

on:
  # Only long-lived branches build on push; feature/integration branches are
  # covered by their pull request (avoids the push + PR double build).
  push:
    branches: ['16.0']
    tags: ['*']
  pull_request:
    branches: ['16.0', 'python-refactor']

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify addon/app version consistency
        run: node ametras_fast_import_client/scripts/check-version.mjs

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python unit tests
        run: |
          cd ametras_fast_import_addon
          # Auto-discover standalone unittest files so new tests are picked up
          # without editing CI. Tests that import Odoo (TransactionCase/HttpCase)
          # need a live Odoo DB — they run in the test-odoo job, so skip them here.
          status=0
          for f in tests/test_*.py; do
            if grep -q "from odoo" "$f"; then
              echo "skip (Odoo integration, runs in test-odoo): $f"
              continue
            fi
            echo "--- $f ---"
            python3 "$f" -v || status=1
          done
          exit $status

  test-vue-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ametras_fast_import_addon/vue-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ametras_fast_import_addon/vue-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ametras_fast_import_addon/vue-app/package-lock.json
            ametras_fast_import_client/package-lock.json
      - run: cd ametras_fast_import_addon/vue-app && npm ci
      - run: cd ametras_fast_import_client && npm ci
      - run: cd ametras_fast_import_client && npm run lint
      - run: cd ametras_fast_import_client && npm run typecheck

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ametras_fast_import_addon/vue-app/package-lock.json
            ametras_fast_import_client/package-lock.json
      - run: cd ametras_fast_import_addon/vue-app && npm ci
      - run: cd ametras_fast_import_client && npm ci
      - name: Install Playwright Chromium
        run: cd ametras_fast_import_client && npx playwright install --with-deps chromium
      - name: Run Playwright e2e tests
        run: cd ametras_fast_import_client && npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: ametras_fast_import_client/playwright-report
          retention-days: 7

  # ── Heavy pipeline (release/tag only) ────────────────────────────────
  # The real Postgres + Odoo integration test and the platform builds/release
  # run only when a version tag is pushed, not on every PR/merge. PRs/merges get
  # the fast checks above. (Validated on PR #13 before gating.)

  test-odoo:
    # Real ir.attachment upload + full HTTP import/logging tests against a live
    # Odoo + DB. TEMPORARILY ungated to validate the new HttpCase on this PR;
    # re-gate to release once green.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout addon
        uses: actions/checkout@v4
        with:
          path: addon
      - name: Checkout Odoo 16.0
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: '16.0'
          fetch-depth: 1
          path: odoo
      - name: Checkout OCA/queue (queue_job dependency)
        uses: actions/checkout@v4
        with:
          repository: OCA/queue
          ref: '16.0'
          fetch-depth: 1
          path: oca-queue
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libldap2-dev libsasl2-dev libxml2-dev \
            libxslt1-dev libpq-dev libjpeg-dev zlib1g-dev libssl-dev
      - name: Install Odoo Python requirements
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r odoo/requirements.txt
      - name: Run addon Odoo integration tests
        run: |
          python odoo/odoo-bin \
            --addons-path=odoo/addons,oca-queue,addon \
            --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
            --database=test_addon --without-demo=all \
            --init=ametras_fast_import_addon \
            --test-enable --test-tags=/ametras_fast_import_addon \
            --stop-after-init --no-http --log-level=test 2>&1 | tee odoo-test.log
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: odoo-test-log
          path: odoo-test.log
          retention-days: 7

  test-embedded-e2e:
    # Playwright against a LIVE embedded Odoo (real web client + controllers).
    # TEMPORARILY ungated to validate on this PR; re-gate to release once green.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout addon
        uses: actions/checkout@v4
        with:
          path: addon
      - name: Checkout Odoo 16.0
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: '16.0'
          fetch-depth: 1
          path: odoo
      - name: Checkout OCA/queue (queue_job dependency)
        uses: actions/checkout@v4
        with:
          repository: OCA/queue
          ref: '16.0'
          fetch-depth: 1
          path: oca-queue
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            addon/ametras_fast_import_addon/vue-app/package-lock.json
            addon/ametras_fast_import_client/package-lock.json
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libldap2-dev libsasl2-dev libxml2-dev \
            libxslt1-dev libpq-dev libjpeg-dev zlib1g-dev libssl-dev
      - name: Install Odoo Python requirements
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r odoo/requirements.txt
      - name: Install client deps + Playwright Chromium
        run: |
          cd addon/ametras_fast_import_client
          npm ci
          npx playwright install --with-deps chromium
      - name: Initialise DB (install addon)
        run: |
          python odoo/odoo-bin \
            --addons-path=odoo/addons,oca-queue,addon \
            --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
            --database=test_embedded --without-demo=all \
            --init=ametras_fast_import_addon --stop-after-init --no-http
      - name: Start Odoo (jobs run inline via QUEUE_JOB__NO_DELAY)
        run: |
          QUEUE_JOB__NO_DELAY=1 nohup python odoo/odoo-bin \
            --addons-path=odoo/addons,oca-queue,addon \
            --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
            --database=test_embedded --db-filter='^test_embedded$' \
            --http-port=8069 --workers=0 --log-level=warn \
            > odoo-server.log 2>&1 &
          echo "Waiting for Odoo..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8069/web/login >/dev/null; then
              echo "Odoo is up"; break
            fi
            sleep 2
          done
      - name: Run embedded Playwright tests
        run: cd addon/ametras_fast_import_client && npm run test:e2e:embedded
        env:
          CI: 'true'
          ODOO_URL: http://localhost:8069
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: embedded-e2e-artifacts
          path: |
            odoo-server.log
            addon/ametras_fast_import_client/playwright-report
          retention-days: 7

  build-addon:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: [check-version, test-python, test-vue-app, test-odoo]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ametras_fast_import_addon/vue-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ametras_fast_import_addon/vue-app/package-lock.json
      - run: npm ci
      - run: npm run build

  build-client:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: [check-version, test-python, test-vue-app, test-client, test-e2e, test-odoo]
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: mac-arm64
            build_arch: arm64
            build_target: mac
            runtime_arch: arm64
            runtime_platform: darwin
          - os: windows-latest
            artifact: win-x64
            build_arch: x64
            build_target: win
            runtime_arch: x64
            runtime_platform: win32
          - os: ubuntu-latest
            artifact: linux-x64
            build_arch: x64
            build_target: linux
            runtime_arch: x64
            runtime_platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ametras_fast_import_addon/vue-app/package-lock.json
            ametras_fast_import_client/package-lock.json
      - run: cd ametras_fast_import_addon/vue-app && npm ci
      - run: cd ametras_fast_import_client && npm ci
      - run: cd ametras_fast_import_client && bash scripts/download-python.sh ${{ matrix.runtime_platform }} ${{ matrix.runtime_arch }}
      - run: cd ametras_fast_import_client && npm run build
      - run: cd ametras_fast_import_client && npx electron-builder --${{ matrix.build_target }} --${{ matrix.build_arch }} --publish never
        env:
          # Skip keychain certificate lookup — ad-hoc signing is sufficient.
          # The download-python.sh script re-signs python-runtime binaries so
          # electron-builder can produce a consistently signed bundle.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ametras-fast-import-${{ matrix.artifact }}
          path: |
            ametras_fast_import_client/release/*.dmg
            ametras_fast_import_client/release/*.exe
            ametras_fast_import_client/release/*.AppImage
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-addon, build-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ametras-fast-import-*
          path: release-assets
          merge-multiple: true
      - name: Verify release artifacts
        run: |
          ls -lah release-assets
          ls -lah release-assets/*.dmg
          ls -lah release-assets/*.exe
          ls -lah release-assets/*.AppImage
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.AppImage
